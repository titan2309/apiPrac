<div
  class="min-h-screen bg-linear-to-br from-gray-800 to-gray-950 flex items-center justify-center p-6"
>
  @if (loading()) {
    <div class="text-gray-300 text-lg animate-pulse">Loading profile...</div>
  } @else {
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md space-y-6">
      <h2 class="text-2xl font-bold text-center text-gray-800">Edit Profile</h2>

      <form [formGroup]="editForm" (ngSubmit)="updateProfile()" class="space-y-4">
        <!-- First Name -->
        <div>
          <input
            type="text"
            formControlName="firstName"
            placeholder="First Name"
            class="w-full border rounded-lg p-3"
          />
        </div>

        <!-- Last Name -->
        <div>
          <input
            type="text"
            formControlName="lastName"
            placeholder="Last Name"
            class="w-full border rounded-lg p-3"
          />
        </div>

        <!-- Email -->
        <div>
          <input
            type="email"
            formControlName="email"
            placeholder="Email"
            class="w-full border rounded-lg p-3"
          />
        </div>

        <!-- Role -->
        <div>
          <select formControlName="role" class="w-full border rounded-lg p-3">
            <option value="">Select Role</option>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <!-- Password -->
        <div>
          <input
            [type]="passwordType()"
            formControlName="password"
            placeholder="Leave blank to keep current password"
            class="w-full border rounded-lg p-3"
          />

          <div class="mt-2 flex items-center space-x-2">
            <input type="checkbox" (change)="togglePassword()" class="cursor-pointer" />
            <label class="text-sm text-gray-600 cursor-pointer"> Show Password </label>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-green-600 text-white py-3 rounded-xl hover:bg-green-700 transition disabled:opacity-50"
          [disabled]="editForm.invalid"
        >
          Update Profile
        </button>
      </form>

      <div class="flex justify-center">
        <button
          (click)="goBack()"
          class="px-6 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition"
        >
          Back
        </button>
      </div>
    </div>
  }
</div>
